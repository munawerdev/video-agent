[project]
name = "video-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "munawerdev", email = "munawer.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.2",
    "chromadb>=1.5.9",
    "deep-translator>=1.11.4",
    "ffmpeg-python>=0.2.0",
    "fpdf2>=2.9.0",
    "huggingface-hub>=1.33.0",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "numpy>=2.5.4",
    "openai-whisper>=20250625",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "streamlit-extras>=1.6.0",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "tqdm>=4.70.1",
    "watchdog>=6.0.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
video-agent = "video_agent:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
